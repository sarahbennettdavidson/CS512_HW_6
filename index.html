<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TV Wall</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; font-size: 14px; }
    #glcanvas { display: block; margin: 12px auto; background: #000; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; align-items: center; margin: 8px; }
    .hint { text-align: center; color: #888; margin: 4px; }
    #shaderError { color: #f66; white-space: pre-wrap; margin: 8px; }
    .editors { display: flex; gap: 8px; margin: 8px; }
    .editors textarea { flex: 1; height: 320px; font-family: monospace; font-size: 12px; background: #1b1b1b; color: #ddd; }
  </style>
</head>
<body>
  <canvas id="glcanvas" width="1200" height="800"></canvas>
  <p class="hint">Drag to orbit. Arrow keys move the camera, W and S move it in and out.</p>

  <!-- Screens and sound -->
  <div class="controls">
    <button id="channelButton">Ch 1</button>
    <button id="screensButton">Screens: spread</button>
    <button id="soundButton">Sound on</button>
    <button id="materialButton">Material: brick</button>
  </div>

  <!-- Rotation -->
  <div class="controls">
    <label>Axis
      <select id="axisSelect">
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
    </label>
    <label>Angle <input id="slider" type="range" min="0" max="360" value="0"> <span id="sliderValue">0</span>°</label>
    <button id="spinButton">Start/Stop</button>
  </div>

  <!-- Trying material maps from your computer -->
  <div class="controls">
    <label>Material folder <input type="file" id="materialInput" webkitdirectory></label>
    <label>Material images <input type="file" id="brickInput" accept="image/*" multiple></label>
  </div>

  <!-- Live shader editors -->
  <pre id="shaderError"></pre>
  <div class="editors">
    <textarea id="vertEditor" spellcheck="false"></textarea>
    <textarea id="fragEditor" spellcheck="false"></textarea>
  </div>

  <script src="transforms.js"></script>
  <script src="models.js"></script>
  <script src="main.js"></script>
</body>
</html>
